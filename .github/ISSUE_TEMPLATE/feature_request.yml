name: Feature request
description: Suggest a focused improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: >-
        DO NOT include LCB_TOKEN, environment variable values, secrets, or
        private repository credentials.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What workflow or problem should be addressed?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
