name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: >-
        Thank you for reporting a bug. DO NOT include LCB_TOKEN, environment
        variable values, secrets, or private repository credentials.
  - type: input
    id: lcb-version
    attributes:
      label: LCB version
      placeholder: 0.1.0-alpha.1
    validations:
      required: true
  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: 8.3.x
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      description: Sanitize paths and arguments before posting.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide a minimal sanitized reproduction.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Secret-safety confirmation
      options:
        - label: I removed tokens, environment values, secrets, and private credentials.
          required: true
